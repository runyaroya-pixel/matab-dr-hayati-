

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مطب دکتر عمران حیاتی</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:16px;
 font-family:Tahoma,sans-serif;
 background:#f1f8f4;color:#234536
}
header{
 background:#23845b;color:white;
 padding:24px 16px;border-radius:18px;
 text-align:center
}
h2,h3{margin-top:0}
.card{
 background:white;padding:18px;
 border-radius:15px;margin-top:16px;
 box-shadow:0 3px 12px #dcebe1
}
input,select,textarea,button{
 width:100%;padding:12px;margin:7px 0;
 border:1px solid #d5e5da;border-radius:9px;
 font-family:inherit;font-size:14px
}
button{
 background:#23845b;color:white;
 border:0;cursor:pointer;font-weight:bold
}
.secondary{background:#e7f4ec;color:#216b49}
.danger{background:#b94b4b}
.patient{
 border:1px solid #dcebe1;
 padding:13px;border-radius:12px;margin-top:10px
}
.small{font-size:12px;color:#668273}
.session{
 background:#f1f8f4;padding:12px;
 border-radius:10px;margin:8px 0
}
.hidden{display:none}
</style>
</head>
<body>

<header>
<h2>مطب دکتر عمران حیاتی</h2>
<p>سیستم مدیریت پرونده مراجعین</p>
</header>

<div class="card">
<h3>ثبت مراجعه‌کننده جدید</h3>
<input id="name" placeholder="نام و نام خانوادگی">
<input id="phone" placeholder="شماره تماس">
<select id="service">
<option>خدمات پوست</option>
<option>کرایولیپولیز</option>
<option>مشاوره</option>
<option>سایر خدمات</option>
</select>
<input id="date" type="date">
<textarea id="notes" placeholder="توضیحات"></textarea>
<button onclick="addPatient()">ثبت پرونده</button>
</div>

<div class="card">
<h3>پرونده‌های مراجعین</h3>
<input id="search" placeholder="جست‌وجوی نام یا شماره تماس"
oninput="showPatients()">
<div id="patients"></div>
</div>

<div class="card hidden" id="details">
<h3>پرونده مراجعه‌کننده</h3>
<div id="patientInfo"></div>
<hr>
<h3>ثبت جلسه جدید</h3>
<input id="sessionDate" type="date">
<select id="sessionService">
<option>خدمات پوست</option>
<option>کرایولیپولیز</option>
<option>مشاوره</option>
<option>سایر خدمات</option>
</select>
<textarea id="sessionNotes"
placeholder="توضیحات جلسه"></textarea>
<button onclick="addSession()">ثبت جلسه</button>
<div id="history"></div>
<button class="secondary" onclick="closeDetails()">بازگشت</button>
</div>

<script>
let data=JSON.parse(localStorage.getItem('clinic')||'[]');
let selected=null;

function saveData(){
 localStorage.setItem('clinic',JSON.stringify(data));
}

function safe(t){
 return String(t||'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;',
 '"':'&quot;',"'":'&#39;'
 }[c]));
}

function addPatient(){
 let name=document.getElementById('name').value.trim();
 let phone=document.getElementById('phone').value.trim();
 let date=document.getElementById('date').value;
 if(!name){alert('نام را وارد کنید');return;}
 data.push({
 id:Date.now(),name,phone,
 service:document.getElementById('service').value,
 date,notes:document.getElementById('notes').value,
 sessions:[]
 });
 saveData();
 showPatients();
 ['name','phone','date','notes'].forEach(x=>
 document.getElementById(x).value=''
 );
 alert('پرونده ثبت شد');
}

function showPatients(){
 let q=document.getElementById('search').value.trim();
 let filtered=data.filter(p=>
 p.name.includes(q)||p.phone.includes(q)
 );
 document.getElementById('patients').innerHTML=
 filtered.map(p=>`
 <div class="patient">
 <b>${safe(p.name)}</b>
 <p class="small">${safe(p.phone)}</p>
 <p>${safe(p.service)}</p>
 <button onclick="openDetails(${p.id})">مشاهده پرونده</button>
 </div>`).join('')||'پرونده‌ای پیدا نشد';
}

function openDetails(id){
 selected=data.find(p=>p.id===id);
 if(!selected)return;
 document.getElementById('details').classList.remove('hidden');
 document.getElementById('patientInfo').innerHTML=`
 <b>${safe(selected.name)}</b>
 <p>شماره: ${safe(selected.phone)}</p>
 <p>خدمت اولیه: ${safe(selected.service)}</p>
 <p>تاریخ تشکیل: ${safe(selected.date)}</p>
 <p>توضیحات: ${safe(selected.notes)}</p>`;
 showHistory();
 document.getElementById('details').scrollIntoView();
}

function showHistory(){
 document.getElementById('history').innerHTML=
 '<h3>سوابق جلسات</h3>'+
 (selected.sessions.map((s,i)=>`
 <div class="session">
 <b>جلسه ${i+1}</b>
 <p>${safe(s.date)}</p>
 <p>${safe(s.service)}</p>
 <p>${safe(s.notes)}</p>
 </div>`).join('')||'<p>هنوز جلسه‌ای ثبت نشده است.</p>');
}

function addSession(){
 if(!selected)return;
 let date=document.getElementById('sessionDate').value;
 if(!date){alert('تاریخ جلسه را وارد کنید');return;}
 selected.sessions.push({
 date,
 service:document.getElementById('sessionService').value,
 notes:document.getElementById('sessionNotes').value
 });
 saveData();
 showHistory();
 document.getElementById('sessionDate').value='';
 document.getElementById('sessionNotes').value='';
 alert('جلسه جدید ثبت شد');
}

function closeDetails(){
 document.getElementById('details').classList.add('hidden');
 selected=null;
}
showPatients();
</script>
</body>
</html>
